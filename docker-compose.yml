version: '3.8'

services:
  bot:
    build: .
    container_name: habit_streak_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
    environment:
      - DATABASE_URL=sqlite:////data/habit_streak.db

